<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>portfolio</title>
    <style>
      #splash { position: fixed; inset: 0; z-index: 999; display: flex; align-items: center; justify-content: center; background: #fdfbf7; transition: opacity .6s ease; }
      #splash img { display: block; max-width: min(60vw, 320px); max-height: 60vh; }
      #splash.splash-hide { opacity: 0; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) { #splash { transition: none; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <img src="/loading.gif" alt="" onerror="this.style.display='none'" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
